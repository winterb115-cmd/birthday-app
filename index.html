const UNIT_COLORS={UN001:'#FFD8A1',UN002:'#FE8B0C',UN003:'#49493F',UN004:'#2BBACC',UN005:'#5F5B5C',UN006:'#8C2246',UN007:'#FE3B99',UN008:'#FFD401',UN009:'#643690',UN010:'#69C0F5',UN011:'#C13432',UN012:'#6F2C19',UN013:'#2D5FA6',UN014:'#A3EA34',UN015:'#5A6964',UN016:'#CABEF0',UN017:'#607D8B',UN018:'#78909C'};
const STAGES=['7days','3days','1day','dday'];
const STAGE_LABELS={'7days':'7','3days':'3','1day':'1','dday':'D'};
const STORAGE_KEY='birthday_notification_settings';
const today=new Date();const currentMonth=today.getMonth()+1;const currentDay=today.getDate();
const getUnitColor=uid=>UNIT_COLORS[uid]||'#888';
const getUnit=uid=>UNITS.find(u=>u.id===uid);
const getAgency=aid=>AGENCIES.find(a=>a.id===aid);
const getCharsByUnit=uid=>CHARACTERS.filter(c=>c.unitId===uid);
const getCharByName=name=>CHARACTERS.find(c=>c.name===name);
const getCircle=cid=>CIRCLES.find(c=>c.id===cid);
const getAmbassador=aid=>AMBASSADORS.find(a=>a.id===aid);
function initDefaults(){const s={};CHARACTERS.forEach(c=>{s[c.id]={'7days':false,'3days':false,'1day':false,'dday':true}});return s}
function loadFromStorage(){try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return initDefaults();const p=JSON.parse(r);return typeof p==='object'&&p?p:initDefaults()}catch(e){return initDefaults()}}
function saveToStorage(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch(e){}}
function computeUnitState(s,uid,stage){return getCharsByUnit(uid).every(c=>s[c.id]&&s[c.id][stage]===true)}

// ─── 초성 검색 ──────────────────────────────────────────
const CHOSUNG=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str){
  return[...str].map(ch=>{
    const code=ch.charCodeAt(0)-0xAC00;
    if(code<0||code>11171)return ch;
    return CHOSUNG[Math.floor(code/588)];
  }).join('');
}
function matchesSearch(name,query){
  if(!query)return true;
  const lower=name.toLowerCase();
  const q=query.toLowerCase();
  if(lower.includes(q))return true;
  return getChosung(name).includes(q);
}

function BottomSheet({char:c,onClose}){
  const[open,setOpen]=useState(false);
  const[dragY,setDragY]=useState(0);
  const startYRef=useRef(0);
  const draggingRef=useRef(false);
  const sheetRef=useRef(null);

  useEffect(()=>{requestAnimationFrame(()=>setOpen(true))},[]);

  const handleClose=()=>{setOpen(false);setTimeout(onClose,350)};

  const handleTouchStart=e=>{startYRef.current=e.touches[0].clientY;draggingRef.current=true};
  const handleTouchMove=e=>{
    if(!draggingRef.current)return;
    const diff=e.touches[0].clientY-startYRef.current;
    if(diff>0)setDragY(diff);
  };
  const handleTouchEnd=()=>{
    draggingRef.current=false;
    if(dragY>120){handleClose()}else{setDragY(0)}
  };

  if(!c)return null;
  const unit=getUnit(c.unitId);
  const agency=getAgency(c.agencyId);
  const color=getUnitColor(c.unitId);
  const circleNames=c.circle_id&&c.circle_id.length>0?c.circle_id.map(cid=>{const cr=getCircle(cid);return cr?cr.name:''}).filter(Boolean):[];
  const ambassador=c.ambassador_id?getAmbassador(c.ambassador_id):null;

  return(
    <>
      <div className={`bottomsheet-overlay ${open?'open':''}`} onClick={handleClose}/>
      <div ref={sheetRef} className={`bottomsheet-container ${open?'open':''}`} style={{transform:open?`translateY(${dragY}px)`:'translateY(100%)'}} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
        <div className="bottomsheet-content">
          <div className="bottomsheet-handle"/>
          <div style={{fontSize:22,fontWeight:800,color:'#333',marginBottom:12}}>{c.name}</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <IconCake size={16} color="#ff4081"/>
              <span style={{fontSize:14,color:'#555'}}>{c.birthday.month}월 {c.birthday.day}일</span>
            </div>
            <div style={{fontSize:14,color:'#555'}}>
              <span style={{fontWeight:600}}>키</span> {c.height}cm · <span style={{fontWeight:600}}>몸무게</span> {c.weight}kg · <span style={{fontWeight:600}}>혈액형</span> {c.blood_type}형 · <span style={{fontWeight:600}}>나이</span> {c.age}세 <span style={{fontSize:11,color:'#999'}}>(ES2년 4/1)</span>
            </div>
            <div style={{fontSize:14,color:'#555'}}>
              <span style={{fontWeight:600}}>소속:</span>{' '}
              <span style={{color:'#555'}}>{agency?agency.name:''}</span>
            </div>
            <div style={{fontSize:14,color:'#555'}}>
              <span style={{fontWeight:600}}>유닛:</span>{' '}
              <span style={{display:'inline-block',padding:'2px 8px',borderRadius:12,background:color+'22',color:color,fontSize:12,fontWeight:600,border:'1px solid '+color+'44'}}>{unit?unit.name:''}</span>
            </div>
            {circleNames.length>0&&(
              <div style={{fontSize:14,color:'#555'}}>
                <span style={{fontWeight:600}}>서클:</span>{' '}
                {circleNames.map((cn,i)=><span key={i} style={{display:'inline-block',padding:'2px 8px',borderRadius:12,background:'#e3f2fd',color:'#1976d2',fontSize:12,fontWeight:500,marginRight:4,marginBottom:2}}>{cn}</span>)}
              </div>
            )}
            {ambassador&&(
              <div style={{fontSize:14,color:'#555'}}>
                <span style={{fontWeight:600}}>앰버서더:</span>{' '}
                <span style={{display:'inline-block',padding:'2px 8px',borderRadius:12,background:'#fce4ec',color:'#c2185b',fontSize:12,fontWeight:500}}>{ambassador.name}</span>
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

const ALARM_TIME_KEY='birthday_alarm_time';
function loadAlarmTime(){try{const r=localStorage.getItem(ALARM_TIME_KEY);if(r){const p=JSON.parse(r);if(typeof p.hour==='number'&&typeof p.minute==='number')return p}return{hour:9,minute:0}}catch(e){return{hour:9,minute:0}}}
function saveAlarmTime(t){try{localStorage.setItem(ALARM_TIME_KEY,JSON.stringify(t))}catch(e){}}
const pad2=n=>String(n).padStart(2,'0');

// ─── GROUP PAGE ─────────────────────────────────────────
function GroupPage(){
  const[mode,setMode]=useState('unit'); // unit | circle | ambassador
  const[search,setSearch]=useState('');
  const[openIds,setOpenIds]=useState(new Set());
  const[sheetChar,setSheetChar]=useState(null);

  const data=useMemo(()=>{
    if(mode==='unit')return UNITS.map(u=>({id:u.id,name:u.name,members:u.characterIds.map(cid=>CHARACTERS.find(c=>c.id===cid)).filter(Boolean)}));
    if(mode==='circle')return CIRCLES.map(cr=>({id:cr.id,name:cr.name,members:cr.members.map(mname=>getCharByName(mname)).filter(Boolean)}));
    return AMBASSADORS.map(a=>({id:a.id,name:a.name,members:a.members.map(mname=>getCharByName(mname)).filter(Boolean)}));
  },[mode]);

  // Auto-expand when searching
  useEffect(()=>{
    if(!search){setOpenIds(new Set());return}
    const matched=new Set();
    data.forEach(group=>{
      const hasMatch=group.members.some(c=>matchesSearch(c.name,search));
      if(hasMatch)matched.add(group.id);
    });
    setOpenIds(matched);
  },[search,data]);

  const toggleId=id=>{setOpenIds(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n})};
  const openAll=()=>setOpenIds(new Set(data.map(d=>d.id)));
  const closeAll=()=>setOpenIds(new Set());

  return(
    <div style={{padding:isMobile?12:20,maxWidth:700,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <IconUsers size={24} color="#ff4081"/>
        <h1 style={{margin:0,fontSize:isMobile?18:24,fontWeight:800,color:'#333'}}>유닛/소속</h1>
      </div>

      {/* Segment Toggle */}
      <div className="glass-strong" style={{borderRadius:12,padding:4,marginBottom:12,display:'flex',gap:4}}>
        {[{k:'unit',l:'유닛별'},{k:'circle',l:'서클별'},{k:'ambassador',l:'앰버서더별'}].map(({k,l})=>(
          <button key={k} onClick={()=>{setMode(k);setSearch('');setOpenIds(new Set())}} style={{flex:1,padding:'10px 0',border:'none',borderRadius:10,cursor:'pointer',fontSize:isMobile?12:14,fontWeight:mode===k?700:500,color:mode===k?'#fff':'#666',background:mode===k?'#ff4081':'transparent',boxShadow:mode===k?'0 0 12px #ff408166':'none',transition:'all .2s'}}>
            {l}
          </button>
        ))}
      </div>

      {/* Search + Controls */}
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="캐릭터 이름 또는 초성 검색..." style={{flex:1,minWidth:180,padding:'10px 14px',borderRadius:10,border:'2px solid #eee',fontSize:14,outline:'none',transition:'border .2s'}} onFocus={e=>e.target.style.borderColor='#ff4081'} onBlur={e=>e.target.style.borderColor='#eee'}/>
        <button onClick={openAll} style={{padding:'8px 14px',border:'none',borderRadius:10,cursor:'pointer',fontSize:12,fontWeight:600,background:'#e3f2fd',color:'#1976d2'}}>전체 열기</button>
        <button onClick={closeAll} style={{padding:'8px 14px',border:'none',borderRadius:10,cursor:'pointer',fontSize:12,fontWeight:600,background:'#fce4ec',color:'#c2185b'}}>전체 닫기</button>
      </div>

      {/* Accordion List */}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {data.map(group=>{
          const isOpen=openIds.has(group.id);
          const unitColor=mode==='unit'?getUnitColor(group.id):'#ff4081';
          const hasSearchMatch=search?group.members.some(c=>matchesSearch(c.name,search)):false;
          if(search&&!hasSearchMatch)return null;
          return(
            <div key={group.id} className="glass-strong fade-in" style={{borderRadius:12,overflow:'hidden',borderLeft:'4px solid '+unitColor}}>
              <button onClick={()=>toggleId(group.id)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',border:'none',cursor:'pointer',background:'transparent',textAlign:'left'}}>
                <div>
                  <div style={{fontSize:15,fontWeight:700,color:'#333'}}>{group.name}</div>
                  <div style={{fontSize:11,color:'#999',marginTop:2}}>{group.members.length}명</div>
                </div>
                <div style={{transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform .3s'}}>
                  <IconChevronDown size={18} color="#999"/>
                </div>
              </button>
              <div className={`accordion-body ${isOpen?'open':''}`}>
                <div style={{padding:'0 12px 12px',display:'flex',flexWrap:'wrap',gap:8}}>
                  {group.members.map(c=>{
                    if(!c)return null;
                    const isHighlighted=search&&matchesSearch(c.name,search);
                    const cColor=getUnitColor(c.unitId);
                    return(
                      <div key={c.id} className={isHighlighted?'search-highlight bounce-click':''} onClick={()=>setSheetChar(c)} style={{padding:'8px 14px',borderRadius:10,background:cColor+'15',border:'1px solid '+cColor+'33',cursor:'pointer',transition:'all .2s'}}>
                        <div style={{fontSize:13,fontWeight:600,color:'#333'}}>{c.name}</div>
                        <div style={{fontSize:10,color:'#888',marginTop:2}}>{getUnit(c.unitId)?.name||''}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {sheetChar&&<BottomSheet char={sheetChar} onClose={()=>setSheetChar(null)}/>}
    </div>
  );
}

      {[{id:'dashboard',label:'대시보드',Ic:IconHome},{id:'calendar',label:'생일보기',Ic:IconCalendar},{id:'groups',label:'유닛/소속',Ic:IconUsers}].map(({id,label,Ic})=>{const a=page===id;return(
        <button key={id} onClick={()=>onNavigate(id)} style={{display:'flex',alignItems:'center',gap:isMobile?4:6,padding:isMobile?'8px 10px':'8px 20px',border:'none',borderRadius:12,cursor:'pointer',fontSize:isMobile?11:14,fontWeight:a?700:500,color:a?'#ff4081':'#666',background:a?'rgba(255,64,129,.1)':'transparent',transition:'all .2s'}}>
          <Ic size={isMobile?16:18}/>{label}
        </button>
      )})}
    </nav>
  );
}

function App(){
  const[page,setPage]=useState('dashboard');
  return(
    <div className="stage-bg">
      <NavBar page={page} onNavigate={setPage}/>
      {page==='dashboard'&&<Dashboard/>}
      {page==='calendar'&&<BirthdayCalendar/>}
      {page==='groups'&&<GroupPage/>}
      {page==='settings'&&<SettingsPage/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

// Register Service Worker with iOS PWA standalone update detection
if('serviceWorker' in navigator){
  let swRegistration=null;

  navigator.serviceWorker.register('/sw.js').then(registration=>{
    swRegistration=registration;
    // 앱 시작 시 즉시 업데이트 확인
    registration.update().catch(()=>{});

    // 새 서비스 워커 발견 시
    registration.addEventListener('updatefound',()=>{
      const newWorker=registration.installing;
      if(!newWorker)return;
      newWorker.addEventListener('statechange',()=>{
        // iOS standalone에서는 controller가 null일 수 있으므로 조건 완화
        if(newWorker.state==='installed'){
          if(navigator.serviceWorker.controller){
            showUpdateToast(registration);
          }else{
            // 최초 설치 후 즉시 활성화 (첫 방문)
            newWorker.postMessage({action:'skipWaiting'});
          }
        }
      });
    });

    // 이미 대기 중인 워커가 있으면 즉시 토스트
    if(registration.waiting){
      showUpdateToast(registration);
    }
  }).catch(()=>{});

  // 새 워커가 제어권 획득 시 리로드
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!refreshing){refreshing=true;window.location.reload()}
  });

  // iOS PWA: 앱이 포그라운드로 돌아올 때 업데이트 체크 (최초 1회만)
  let hasCheckedOnResume=false;
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&swRegistration&&!hasCheckedOnResume){
      hasCheckedOnResume=true;
      swRegistration.update().catch(()=>{});
    }
  });

  // iOS PWA: pageshow 이벤트 (bfcache에서 복원될 때, 최초 1회)
  window.addEventListener('pageshow',e=>{
    if(e.persisted&&swRegistration&&!hasCheckedOnResume){
      hasCheckedOnResume=true;
      swRegistration.update().catch(()=>{});
    }
  });
}

function showUpdateToast(registration){
  if(document.getElementById('update-toast'))return;
  const toast=document.createElement('div');
  toast.id='update-toast';
  toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 20px;border-radius:24px;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:fadeIn .4s ease-out;max-width:90vw';
  toast.innerHTML=`
    <span style="color:#f1f5f9;font-size:13px;font-weight:500">새 버전이 있습니다</span>
    <button id="update-btn" style="padding:8px 16px;border:none;border-radius:16px;background:#f43f5e;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 0 12px rgba(244,63,94,.4)">업데이트</button>
  `;
  document.body.appendChild(toast);
  document.getElementById('update-btn').addEventListener('click',()=>{
    if(registration.waiting){registration.waiting.postMessage({action:'skipWaiting'})}
    toast.remove();
  });
}
</script>
